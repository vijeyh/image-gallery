<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="full-img" id="fullImgBox">
        <img src="./images/img1.jpg" id="fullImg" />
        <span onclick="closeImg()">X</span>
      </div>

      <h1>Image Gallery</h1>
      <hr />

      <div class="img-gallery">
        <img src="./images/img1.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img2.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img3.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img4.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img5.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img6.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img7.jpg" onclick="openImg(this.src)" alt="" />
        <img src="./images/img8.jpg" onclick="openImg(this.src)" alt="" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
